[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "src/server/functions"
  node_bundler = "esbuild"

[functions.api]
  timeout = 10

# These pages are the app. /api stays on the function because this list does not include it.
[[redirects]]
  from = "/mlbmoves"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/mlbmoves/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/newsfeed"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/newsfeed/"
  to = "/index.html"
  status = 200

[[redirects]]
